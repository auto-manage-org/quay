name: GitHub Branch Protection check by complyctl

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  call_reusable_github_bp:
    name: GitHub Branch Protection Scan
    uses: AlexXuan233/org-infra/.github/workflows/reusable_github_bp.yml@add-github-bp-workflow
    with:
      target_github_repo: ${{ github.repository }}
      target_branch: master
    secrets:
      source_token: ${{ secrets.GITHUB_TOKEN }}

  comment_pr:
    name: Post Branch Protection Report
    runs-on: ubuntu-latest
    needs: call_reusable_github_bp
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Download scan results
        uses: actions/download-artifact@v4
        with:
          name: report-policies-ampel-branch-protection.md

      - name: Post report as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          report=$(cat report-*.md)
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$report"